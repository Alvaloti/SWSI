<div class="register-container">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
        <h2>Alta de Usuario</h2>
        <p>Por favor, completa los datos.</p>

        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="nombre" formControlName="username" placeholder="Username">
            <small *ngIf="registerForm.get('username')?.hasError('required') && registerForm.get('username')?.touched">
                Usuario es requerido.
            </small>
        </div>

        <div class="form-group">
            <label for="nomina" >Nómina</label>
            <input type="text" id="nomina" formControlName="nomina" placeholder="Nómina">
            <small *ngIf="registerForm.get('nomina')?.hasError('required') && registerForm.get('nomina')?.touched">
                Nómina es requerida.
            </small>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" formControlName="email" placeholder="correo@ejemplo.com">
            <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
                <div *ngIf="registerForm.get('email')?.errors?.['required']">Email es requerido.</div>
                <div *ngIf="registerForm.get('email')?.errors?.['email']">Formato de email inválido.</div>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" formControlName="password" placeholder="Mínimo 8 caracteres">
            <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
                <div *ngIf="registerForm.get('password')?.errors?.['required']">Contraseña es requerida.</div>
                <div *ngIf="registerForm.get('password')?.errors?.['minlength']">
                    Contraseña debe tener al menos 8 caracteres.
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" id="name" formControlName="name" placeholder="Nombre">
            <small *ngIf="registerForm.get('name')?.hasError('required') && registerForm.get('name')?.touched">
                El nombre es requerido.
            </small>
        </div>

        <div class="form-group">
            <label for="last_name">Apellidos</label>
            <input type="text" id="last_name" formControlName="last_name" placeholder="Apellidos">
        </div>

        <div class="form-group">
            <label for="rol">Rol de la Cuenta</label>
            <select id="rol" formControlName="rolId">
                <option value="" disabled>Seleccione una opción</option>
                <option *ngFor="let role of roles" [value]="role._id">
                    {{ role.name }}
                </option>
            </select>
            <small *ngIf="rolesError">{{ rolesError }}</small>
        </div>

        <div class="form-group">
            <label for="area">Área</label>
            <select id="area" formControlName="area">
                <option value="" disabled>Seleccione una opción</option>
                <option *ngFor="let area of areas" [value]="area._id">
                    {{ area.name }}
                </option>
            </select>
            <small *ngIf="registerForm.get('area')?.hasError('required') && registerForm.get('area')?.touched">
                El área es requerida.
            </small>
            <small *ngIf="areasError">{{ areasError }}</small>
        </div>

        <button type="submit" [disabled]="registerForm.invalid" class="submit-btn">Registrar</button>
        <button type="button" matFab extended class="cancel-btn" (click)="loadChildren('home')">Cancelar</button>
    </form>

</div>
