<main class="recovery-page">
    <section class="recovery-card" aria-labelledby="recovery-title">
        <img src="https://imagenes.leon.gob.mx/dependencias/tecnologias-de-la-informacion-b.svg"
            alt="Dirección General de Tecnologías de la Información y Gobierno Digital">
        <h1 id="recovery-title">Recuperar contraseña</h1>
        <p>Escribe el correo de tu cuenta. Te enviaremos un enlace válido durante 30 minutos.</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <label for="recovery-email">Correo electrónico</label>
            <input id="recovery-email" type="email" formControlName="email" autocomplete="email"
                placeholder="usuario@correo.com">
            <small *ngIf="form.controls.email.touched && form.controls.email.hasError('required')">
                El correo electrónico es obligatorio.
            </small>
            <small *ngIf="form.controls.email.touched && form.controls.email.hasError('email')">
                Ingresa un correo electrónico válido.
            </small>

            <button type="submit" [disabled]="submitting || form.disabled">
                {{ submitting ? 'Enviando…' : 'Enviar enlace' }}
            </button>
        </form>

        <p class="success-message" role="status" *ngIf="message">{{ message }}</p>
        <p class="error-message" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
        <a routerLink="/login">Volver a iniciar sesión</a>
    </section>
</main>
