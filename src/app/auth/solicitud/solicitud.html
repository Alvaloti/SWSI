<div class="solicitud-container">
    <form [formGroup]="solicitudForm" (ngSubmit)="onSubmit()" class="solicitud-form">
        <h2>Solicitud de Soporte</h2>
        <p>Por favor, completa los datos.</p>

        <div class="form-grid">
            <div class="form-group">
                <label for="solicitud-category">Categoría</label>
                <select id="solicitud-category" formControlName="category">
                    <option value="" disabled>Seleccionar categoría</option>
                    <option *ngFor="let category of categories" [value]="category._id">{{ category.name }}</option>
                </select>
                <small *ngIf="solicitudForm.get('category')?.hasError('required') && solicitudForm.get('category')?.touched">
                    La categoría es requerida.
                </small>
            </div>

            <div class="form-group">
                <label for="area">Área</label>
                <select id="area" formControlName="area">
                    <option value="" disabled>Seleccionar área</option>
                    <option *ngFor="let area of areas" [value]="area._id">{{ area.name }}</option>
                </select>
                <small *ngIf="solicitudForm.get('area')?.hasError('required') && solicitudForm.get('area')?.touched">
                    Área es requerida.
                </small>
            </div>

            <div class="form-group full-width">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" formControlName="descripcion" placeholder="Descripción">
                <small
                    *ngIf="solicitudForm.get('descripcion')?.hasError('required') && solicitudForm.get('descripcion')?.touched">
                    Descripción es requerida.
                </small>
            </div>

            <div class="form-group">
                <label for="prioridad">Prioridad</label>
                <select id="prioridad" formControlName="prioridad">
                    <option value="">Seleccionar Prioridad</option>
                    <option *ngFor="let priority of priorities" [value]="priority.key">{{ priority.name }}</option>
                </select>
                <small
                    *ngIf="solicitudForm.get('prioridad')?.hasError('required') && solicitudForm.get('prioridad')?.touched">
                    Prioridad es requerida.
                </small>
            </div>

            <div class="form-group">
                <label for="solicitud-archivo">Archivo adjunto (opcional)</label>
                <input id="solicitud-archivo" type="file"
                    accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,application/pdf,image/jpeg,image/png,image/gif,image/webp"
                    (change)="onFileSelected($event)">
                <small class="file-help">PDF o imagen, máximo {{ maxAttachmentMb }} MB.</small>
                <small class="file-error" *ngIf="fileError">{{ fileError }}</small>
                <small class="selected-file" *ngIf="selectedFile">Seleccionado: {{ selectedFile.name }}</small>
            </div>

            <div class="form-group full-width">
                <label for="comentarios">Comentarios</label>
                <input type="text" id="comentarios" formControlName="comentarios" placeholder="Comentarios">
            </div>
        </div>

        <div class="form-actions">
            <button type="button" mat-raised-button class="cancel-btn" (click)="cancel()">Cancelar</button>
            <button type="submit" mat-raised-button color="primary" class="submit-btn"
                [disabled]="solicitudForm.invalid || !!fileError || submitting">
                {{ submitting ? 'Guardando...' : 'Enviar Solicitud' }}
            </button>
        </div>
    </form>
</div>
