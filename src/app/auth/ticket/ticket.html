<div class="ticket-container">
    <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()" class="ticket-form">
        <h2>Generar Ticket</h2>
        <p>Por favor, complete el siguiente formulario para generar un ticket.</p>

        <div class="form-group">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" formControlName="titulo" placeholder="Ingrese el título de la solicitud">
            <small *ngIf="ticketForm.get('titulo')?.hasError('required') && ticketForm.get('titulo')?.touched">
                Título es requerido.
            </small>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" formControlName="descripcion" placeholder="Descripción">
            <small
                *ngIf="ticketForm.get('descripcion')?.hasError('required') && ticketForm.get('descripcion')?.touched">
                Descripción es requerida.
            </small>
        </div>

        <div class="form-group">
            <label for="prioridad">Prioridad</label>
            <select id="prioridad" formControlName="prioridad">
                <option value="">Seleccionar Prioridad</option>
                <option value="muy-baja">Muy Baja</option>
                <option value="baja">Baja</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
                <option value="muy-alta">Muy Alta</option>
            </select>
            <small
                *ngIf="ticketForm.get('prioridad')?.hasError('required') && ticketForm.get('prioridad')?.touched">
                Prioridad es requerida.
            </small>
        </div>

         <div class="form-group">
            <label for="solucion">Solución</label>
            <input type="text" id="solucion" formControlName="solucion" placeholder="Describa la solución">
        </div>

        <button type="submit" [disabled]="ticketForm.invalid" class="submit-btn">Generar Ticket</button>
        <button type="button" mat-raised-button color="accent" class="cancel-btn" (click)="loadChildren('hometick')">Cancelar</button>
    </form>
</div>
