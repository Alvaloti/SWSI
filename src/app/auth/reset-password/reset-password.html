<main class="recovery-page">
    <section class="recovery-card" aria-labelledby="reset-title">
        <img src="https://imagenes.leon.gob.mx/dependencias/tecnologias-de-la-informacion-b.svg"
            alt="Dirección General de Tecnologías de la Información y Gobierno Digital">
        <h1 id="reset-title">Nueva contraseña</h1>
        <p>Debe contener al menos 8 caracteres, mayúscula, minúscula, número y carácter especial.</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="token && !completed">
            <label for="new-password">Nueva contraseña</label>
            <input id="new-password" type="password" formControlName="password" autocomplete="new-password">
            <small *ngIf="form.controls.password.touched && form.controls.password.invalid">
                La contraseña no cumple con los requisitos.
            </small>

            <label for="password-confirmation">Confirmar contraseña</label>
            <input id="password-confirmation" type="password" formControlName="confirmation" autocomplete="new-password">
            <small *ngIf="form.controls.confirmation.touched && form.controls.confirmation.hasError('required')">
                Confirma la contraseña.
            </small>

            <button type="submit" [disabled]="submitting">
                {{ submitting ? 'Actualizando…' : 'Actualizar contraseña' }}
            </button>
        </form>

        <p class="success-message" role="status" *ngIf="message">{{ message }}</p>
        <p class="error-message" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
        <a routerLink="/login">Volver a iniciar sesión</a>
    </section>
</main>
